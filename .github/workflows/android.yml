name: Android APK

# Builds an installable Android app (APK) on GitHub's machines and publishes it as a
# GitHub Release, so it can be downloaded straight to a phone.
on:
  push:
    branches: [main, claude/credits-vs-time-limit-8evwz3]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: android
        # The release build is signed with the project's debug key, which is enough to
        # install it directly on a phone (not for the Play Store).
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect the APK
        run: |
          version=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "NutriTrack.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-android-${{ github.run_number }}
          path: NutriTrack.apk

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${VERSION}-build.${{ github.run_number }}"
          gh release create "$tag" NutriTrack.apk \
            --target "${{ github.sha }}" \
            --title "NutriTrack ${VERSION} for Android (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}.

          Install: open this page on your Android phone, tap **NutriTrack.apk**, then open the downloaded file and allow installing from this source when asked."
